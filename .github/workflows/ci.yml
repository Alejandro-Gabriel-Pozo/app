name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ------------------------------------------------------------
  # Job 1 — Tests unitarios con cobertura
  # ------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  # ------------------------------------------------------------
  # Job 2 — Typecheck + build (independiente de test)
  #
  # No usa `needs: test` para que los errores de tipos sean
  # visibles aunque los tests fallen, y viceversa.
  # ------------------------------------------------------------
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & build
        run: npm run build

  # ------------------------------------------------------------
  # Job 3 — Lint
  #
  # Corre en paralelo con test y typecheck.
  # --max-warnings 0: cualquier warning es error de CI.
  # Atrapa: imports rotos, no-explicit-any, consistent-type-imports.
  # ------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
