name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ------------------------------------------------------------
  # Job 1 — Tests unitarios con cobertura
  # ------------------------------------------------------------
  test:
    runs-on: ubuntu-latest

    # Sin `services: postgres` a propósito (F2, 05/09/2026). Este job corre
    # `test:coverage` → `vitest.config.ts`, que excluye `src/tests/integration/**`
    # SIEMPRE (ver el docblock de ese archivo: el exclude gana incluso pasando
    # el path por CLI). El contenedor de Postgres y el TEST_DATABASE_URL que
    # vivían acá eran configuración muerta: ningún test de este job los tocaba
    # —los 3 hits de TEST_DATABASE_URL fuera de integration/ son comentarios—,
    # pero leídos desde afuera daban la impresión de que la suite de
    # integración corría en CI. No corría en ningún job. Ahora corre, en el
    # job `integration` de más abajo.
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'   # alineado a engines.node (>=22.12.0 <23.0.0) y a render.yaml

      - name: Install dependencies
        run: npm install

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  # ------------------------------------------------------------
  # Job 2 — Typecheck & build
  # ------------------------------------------------------------
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'   # alineado a engines.node (>=22.12.0 <23.0.0) y a render.yaml

      - name: Install dependencies
        run: npm install

      - name: Typecheck & build
        run: npm run build

  # ------------------------------------------------------------
  # Job 3 — Lint
  # ------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'   # alineado a engines.node (>=22.12.0 <23.0.0) y a render.yaml

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      # Fase 0 de docs/plan-separacion-dominios-multirubro-2026-08-28.md.
      # eslint mira higiene de archivo (no-any, no-unused-vars); esto mira
      # los límites entre bounded contexts que el CLAUDE.md de este repo y
      # docs/arquitectura-monolito-modular.md §4 declaran por escrito y que
      # hasta ahora solo sostenía la disciplina. Va acá, en el mismo job que
      # eslint, a propósito: una regla de arquitectura que no corre en CI no
      # es una regla. Las 6 reglas se verificaron contra violaciones de
      # prueba antes de commitearlas — ninguna es decorativa.
      - name: Lint de arquitectura (límites entre dominios)
        run: npm run lint:arch

  # ------------------------------------------------------------
  # Job 4 — Chequeo de versión de schema (A4, pendientes-2026-08-13.md)
  #
  # El incidente del 13/08/2026: schema.sql cambió (accounts_receivable +
  # stay_id) pero nadie bumpeó CURRENT_SCHEMA_VERSION a mano, así que
  # migrate:tenants se reportó a sí mismo "al día" sin aplicar nada contra
  # la tenant DB real — el sitio quedó roto en producción hasta que se
  # detectó y se corrigió a mano vía Neon MCP. Este job hace imposible que
  # el mismo olvido vuelva a pasar sin que alguien lo note antes de mergear.
  # ------------------------------------------------------------
  schema-version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verificar que CURRENT_SCHEMA_VERSION se bumpeó si schema.sql cambió
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          HEAD="${{ github.sha }}"

          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "Sin commit anterior para comparar (branch/historia nueva) — se salta el chequeo."
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE" "$HEAD")

          if ! echo "$CHANGED" | grep -qx 'src/db/schema.sql'; then
            echo "schema.sql no cambió en este rango — nada que chequear."
            exit 0
          fi

          # 09-10/09/2026 (falso positivo real: cd4dff6/5049c2d tocaron
          # schema.sql con SOLO comentarios -- corrigiendo anclas de línea
          # hacia platform.schema.sql -- y este chequeo exigió un bump que
          # no correspondía). 51% de schema.sql son líneas `--` (medido);
          # una cerca ciega al contenido sobre ese archivo iba a seguir
          # disparando en falso. Filtra el diff a solo líneas que NO son
          # comentario (`--`, con espacio opcional antes) ni blancas --
          # mismo criterio que stripComments() usa en otras cercas de este
          # repo (generate-route-inventory.ts, api-auth-gate-order.test.ts),
          # pero acotado a SQL: solo entiende `--`, no `/* */` (hoy 0
          # ocurrencias de `/* ` en schema.sql -- si alguien lo agrega,
          # ese comentario NO se filtra y el chequeo exige un bump de más,
          # nunca de menos, así que no es un hueco de seguridad, solo un
          # falso positivo nuevo el día que pase).
          #
          # Residual declarado, no cerrado acá: una línea que empieza con
          # `--` pero es DATA -- dentro de un literal de comillas simples
          # que cruza un salto de línea, o de un cuerpo $$...$$ -- se
          # filtraría igual, aunque sea SQL real. Verificado que hoy (v47)
          # esa clase está vacía (0 líneas `--` dentro de bloques `$$`, 0
          # literales con comillas simples que crucen renglón) -- pero no
          # es estructuralmente imposible a futuro. Si algún día un seed
          # necesita un literal multilínea, revisar este filtro antes de
          # confiar en él para ESE commit.
          #
          # SCHEMA_DIFF se captura SIN `|| true`: bajo `bash -e` (el shell
          # de este job), un git diff que fallara (BASE inalcanzable,
          # historia recortada) mata el step acá -- no lo deja pasar en
          # silencio disfrazado de "solo comentarios". El `|| true` de más
          # abajo cubre únicamente "el grep no tuvo matches", que es
          # esperado y no un error.
          SCHEMA_DIFF=$(git diff "$BASE" "$HEAD" -- src/db/schema.sql)
          NON_COMMENT_DIFF=$(printf '%s\n' "$SCHEMA_DIFF" \
            | grep -E '^[+-]' \
            | grep -vE '^(\+\+\+|---)' \
            | grep -vE '^[+-][[:space:]]*--' \
            | grep -vE '^[+-][[:space:]]*$' || true)

          if [ -z "$NON_COMMENT_DIFF" ]; then
            echo "schema.sql cambió pero solo en comentarios/líneas en blanco -- nada que chequear. Diff ignorado (verde silencioso evitado a propósito, ver ci.yml):"
            printf '%s\n' "$SCHEMA_DIFF"
            exit 0
          fi

          # -E (POSIX extended), no -P: -P depende de PCRE y falla con
          # "supports only unibyte and UTF-8 locales" en algunos entornos
          # (confirmado localmente en Git Bash / MSYS2) — -E es portable.
          OLD_VERSION=$(git show "$BASE:src/platform/tenant-db.setup.ts" 2>/dev/null \
            | grep -oE 'CURRENT_SCHEMA_VERSION[[:space:]]*=[[:space:]]*[0-9]+' \
            | grep -oE '[0-9]+$' || true)
          NEW_VERSION=$(git show "$HEAD:src/platform/tenant-db.setup.ts" 2>/dev/null \
            | grep -oE 'CURRENT_SCHEMA_VERSION[[:space:]]*=[[:space:]]*[0-9]+' \
            | grep -oE '[0-9]+$' || true)

          if [ -z "$NEW_VERSION" ]; then
            echo "::error::No se pudo leer CURRENT_SCHEMA_VERSION en src/platform/tenant-db.setup.ts — revisar que la constante sigue existiendo con ese nombre."
            exit 1
          fi

          if [ "$OLD_VERSION" = "$NEW_VERSION" ]; then
            echo "::error::src/db/schema.sql cambió pero CURRENT_SCHEMA_VERSION (src/platform/tenant-db.setup.ts) sigue en $NEW_VERSION. Bumpeala en este mismo commit y, después de mergear, corré 'npm run migrate:tenants' contra la BD real (o aplicá el cambio a mano vía Neon MCP) — ver docs/criterios-datos.md y docs/pendientes-2026-08-13.md (A4)."
            exit 1
          fi

          echo "schema.sql cambió y CURRENT_SCHEMA_VERSION pasó de $OLD_VERSION a $NEW_VERSION — OK."

  # ------------------------------------------------------------
  # Job — Inventario de rutas generado, CONTRACT-COVERAGE-001 (09/09/2026)
  #
  # src/openapi/spec.ts documenta 18 de 251 endpoints reales, a mano. En vez
  # de intentar completarlo a mano (mismo modo de falla que ya causó
  # CONTRACT-001: la copia se desincroniza y nadie se entera), se genera un
  # inventario de EXISTENCIA (no autz, no schemas) booteando la app real y
  # caminando app._router.stack -- ver el header de
  # src/scripts/generate-route-inventory.ts para el diseño completo (gate
  # architecture-governor, 09/09/2026).
  #
  # Mismo molde que schema-version-check de arriba: el artefacto generado
  # (docs/inventario-rutas.md) se versiona junto al código, y este job lo
  # regenera y compara contra lo commiteado -- si alguien agrega una ruta y
  # no corre `npm run docs:routes`, el build falla en vez de dejar el
  # inventario mentir en silencio. `generate-route-inventory.ts` en sí ya
  # falla ruidoso si encuentra un mount sin explicar (ver CLOSURE_MOUNTS en
  # ese archivo), así que este job cubre la otra mitad: que lo generado y lo
  # commiteado sean el mismo archivo.
  # ------------------------------------------------------------
  route-inventory-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Regenerar el inventario y comparar contra lo commiteado
        run: |
          npm run docs:routes
          if ! git diff --exit-code -- docs/inventario-rutas.md; then
            echo "::error::docs/inventario-rutas.md quedó desincronizado -- corré 'npm run docs:routes' y commiteá el resultado."
            exit 1
          fi
          echo "docs/inventario-rutas.md está al día."

  # ------------------------------------------------------------
  # Job 5 — Tests de integración contra Postgres real (F2, 05/09/2026)
  #
  # Por qué existe: hasta el 05/09/2026 NINGÚN job corría
  # `npm run test:integration`. El job `test` corre `test:coverage` →
  # `vitest.config.ts`, que excluye `src/tests/integration/**` siempre. O sea
  # que cada prueba determinística de lock (ORDER-10, RESERVA-10,
  # FACT-CONSOL-TOCTOU-01, FOR-KEY-SHARE-001…) era un hecho real pero LOCAL y
  # de una sola sesión: nada la volvía a correr en el commit siguiente. Eso
  # degradaba toda la evidencia [V] de integración citada en los
  # docs/pendientes-*.md. Ver F2 en docs/pendientes-2026-09-05.md.
  #
  # Va como job aparte y no dentro de `test` a propósito: usa otra config
  # (`vitest.integration.config.ts`, testTimeout 30s), necesita el contenedor
  # de Postgres, y tarda bastante más. Mezclarlos haría que un fallo de
  # integración se lea como un fallo de unitarios y viceversa.
  #
  # Sobre el verde silencioso —la otra mitad de F2—: `skipIfNoDb`
  # (src/tests/integration/helpers/db.ts) ya NO saltea cuando CI=true. Si este
  # job perdiera el TEST_DATABASE_URL, falla en ROJO en vez de reportar "todo
  # bien" habiendo corrido cero tests.
  # ------------------------------------------------------------
  integration:
    runs-on: ubuntu-latest

    # Techo explícito: 54 suites al 21/09/2026 (Wave 13, Zona 1 + Zona 2,
    # gate `architecture-governor`) — decía "48 al 16/09/2026"; el delta +6
    # son las suites nuevas agregadas entre el 16 y el 21/09 (incluye
    # `city-ledger-double-transfer-adoption.integration.test.ts` y
    # `invoice-retry-charge-guard.integration.test.ts`, ambas de esta
    # Wave). Contar con el MISMO glob que corre CI
    # (`vitest.integration.config.ts:25`, `src/tests/integration/**/*.test.ts`
    # — recursivo):
    #   find src/tests/integration -name '*.test.ts' | wc -l
    # Número a MANO: lo desactualiza cualquier suite nueva bajo
    # `src/tests/integration/` (incluidas subcarpetas, como `helpers/`).
    # Cada suite hace CREATE DATABASE + schema.sql completo. Si algo se
    # cuelga (un lock que no se libera, un pool que no cierra), que corte
    # acá y no a los 360 minutos del default. 20' sigue siendo margen amplio
    # (la única corrida medida contra postgres:16-alpine local fue 22
    # suites / 104 s, zulu-hub-continuidad-2026-09-07.md, 07/09) pero el
    # margen real con 54 suites no se remidió en este bloque — revisar si
    # el job empieza a acercarse al techo.
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >
          --health-cmd "pg_isready -U testuser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'   # alineado a engines.node (>=22.12.0 <23.0.0) y a render.yaml

      - name: Install dependencies
        run: npm install

      # El helper crea una BD temporal por suite (CREATE DATABASE + aplicar
      # src/db/schema.sql entero) y la dropea al terminar, así que el usuario
      # necesita permisos de CREATE/DROP DATABASE — el superusuario del
      # contenedor los tiene. Ver src/tests/integration/helpers/db.ts.
      - name: Run integration tests
        run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgres://testuser:testpass@localhost:5432/postgres
