services:
  - type: web
    name: reservations-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"

      # ---------------------------------------------------------------------------
      # Secretos — definir manualmente en Render Dashboard (sync: false = no commitear)
      # ---------------------------------------------------------------------------

      # JWT
      - key: JWT_SECRET
        sync: false

      # Base de datos central (plataforma multi-tenant)
      - key: PLATFORM_DATABASE_URL
        sync: false

      # Base de datos del tenant (modo single-tenant / dev)
      - key: DATABASE_URL
        sync: false

      # CORS — dominio del frontend (ej. https://mi-app.vercel.app)
      - key: CORS_ORIGIN
        sync: false

      # Credenciales del usuario ADMIN
      - key: ADMIN_USER_ID
        sync: false
      - key: ADMIN_USER_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false

      # Credenciales del usuario RECEPCIONISTA
      - key: RECEP_USER_ID
        sync: false
      - key: RECEP_USER_EMAIL
        sync: false
      - key: RECEP_PASSWORD_HASH
        sync: false

      # Credenciales del usuario MESERO/WAITER
      - key: WAITER_USER_ID
        sync: false
      - key: WAITER_USER_EMAIL
        sync: false
      - key: WAITER_PASSWORD_HASH
        sync: false
