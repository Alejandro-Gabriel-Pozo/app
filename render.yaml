services:
  - type: web
    name: reservations-api
    runtime: node
    plan: free
    # migrate:tenants agregado acá (14/08/2026, A4 opción b,
    # docs/pendientes-2026-08-13.md) — aplica schema.sql (idempotente)
    # contra cada tenant DB real en cada deploy. Render soporta
    # `preDeployCommand` (corre después del build, antes del start) para
    # esto, pero **requiere plan pago** — confirmado contra la doc oficial
    # de Render (https://render.com/docs/deploy-rails-6-7: "The pre-deploy
    # command requires a paid instance type. If you're running on the Free
    # instance type, you can include a database migration step in your
    # build command"). Este servicio está en `plan: free`, así que se
    # agrega acá en vez de en preDeployCommand.
    #
    # Si falla (algún tenant no migra), el build entero falla y Render
    # NO despliega la versión nueva — sigue sirviendo la anterior. Es el
    # comportamiento buscado (fail loud, docs/criterios-datos.md R15): un
    # schema.sql sin aplicar en algún tenant no debe pasar desapercibido.
    # Con un solo tenant real hoy el riesgo de que UN tenant caído bloquee
    # el deploy de TODOS es bajo — revisar este acoplamiento si el número
    # de tenants crece (podría convenir no fallar el build por un tenant
    # puntual y solo alertar, en vez de bloquear a todos).
    buildCommand: npm install && npm run build && npm run migrate:tenants
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"

      # SSL para TODOS los pools de Postgres del proceso (platform, tenant,
      # legado) — ver db/pg.client.ts::sslConfig(). Sin esto, los pools caen
      # a ssl:false y la conexión a Neon/Supabase falla. No es un secreto,
      # pero si falta, el proceso no debe asumir un default en silencio.
      - key: NEON_SSL
        value: "true"

      # ---------------------------------------------------------------------------
      # Secretos — definir manualmente en Render Dashboard (sync: false = no commitear)
      # ---------------------------------------------------------------------------

      # JWT
      - key: JWT_SECRET
        sync: false

      # Base de datos central (plataforma multi-tenant)
      - key: PLATFORM_DATABASE_URL
        sync: false

      # Cifrado de connection strings de tenants
      # Generar con: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      - key: DB_ENCRYPTION_KEY
        sync: false

      # CORS — dominio del frontend (ej. https://mi-app.vercel.app)
      - key: CORS_ORIGIN
        sync: false

      # ---------------------------------------------------------------------------
      # Supabase — provisioning automático de BD por negocio
      # ---------------------------------------------------------------------------

      # Personal access token (Supabase Dashboard → Account → Access Tokens)
      - key: SUPABASE_ACCESS_TOKEN
        sync: false

      # Organization ID de tu cuenta Supabase
      - key: SUPABASE_ORG_ID
        sync: false

      # Salt para derivar passwords únicos por negocio
      - key: SUPABASE_DB_PASSWORD_SALT
        sync: false

      # Región para nuevos proyectos Supabase (default: us-east-1)
      - key: SUPABASE_REGION
        value: us-east-1
