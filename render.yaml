services:
  - type: web
    name: reservations-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"

      # SSL para TODOS los pools de Postgres del proceso (platform, tenant,
      # legado) — ver db/pg.client.ts::sslConfig(). Sin esto, los pools caen
      # a ssl:false y la conexión a Neon/Supabase falla. No es un secreto,
      # pero si falta, el proceso no debe asumir un default en silencio.
      - key: NEON_SSL
        value: "true"

      # ---------------------------------------------------------------------------
      # Secretos — definir manualmente en Render Dashboard (sync: false = no commitear)
      # ---------------------------------------------------------------------------

      # JWT
      - key: JWT_SECRET
        sync: false

      # Base de datos central (plataforma multi-tenant)
      - key: PLATFORM_DATABASE_URL
        sync: false

      # Cifrado de connection strings de tenants
      # Generar con: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      - key: DB_ENCRYPTION_KEY
        sync: false

      # CORS — dominio del frontend (ej. https://mi-app.vercel.app)
      - key: CORS_ORIGIN
        sync: false

      # ---------------------------------------------------------------------------
      # Supabase — provisioning automático de BD por negocio
      # ---------------------------------------------------------------------------

      # Personal access token (Supabase Dashboard → Account → Access Tokens)
      - key: SUPABASE_ACCESS_TOKEN
        sync: false

      # Organization ID de tu cuenta Supabase
      - key: SUPABASE_ORG_ID
        sync: false

      # Salt para derivar passwords únicos por negocio
      - key: SUPABASE_DB_PASSWORD_SALT
        sync: false

      # Región para nuevos proyectos Supabase (default: us-east-1)
      - key: SUPABASE_REGION
        value: us-east-1
