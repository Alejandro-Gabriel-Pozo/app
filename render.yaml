services:
  - type: web
    name: reservations-api
    runtime: node
    plan: free
    # migrate:tenants agregado acá (14/08/2026, A4 opción b,
    # docs/pendientes-2026-08-13.md) — aplica schema.sql (idempotente)
    # contra cada tenant DB real en cada deploy. Render soporta
    # `preDeployCommand` (corre después del build, antes del start) para
    # esto, pero **requiere plan pago** — confirmado contra la doc oficial
    # de Render (https://render.com/docs/deploy-rails-6-7: "The pre-deploy
    # command requires a paid instance type. If you're running on the Free
    # instance type, you can include a database migration step in your
    # build command"). Este servicio está en `plan: free`, así que se
    # agrega acá en vez de en preDeployCommand.
    #
    # Si falla (algún tenant no migra), el build entero falla y Render
    # NO despliega la versión nueva — sigue sirviendo la anterior. Es el
    # comportamiento buscado (fail loud, docs/criterios-datos.md R15): un
    # schema.sql sin aplicar en algún tenant no debe pasar desapercibido.
    # Con un solo tenant real hoy el riesgo de que UN tenant caído bloquee
    # el deploy de TODOS es bajo — revisar este acoplamiento si el número
    # de tenants crece (podría convenir no fallar el build por un tenant
    # puntual y solo alertar, en vez de bloquear a todos).
    # `npx puppeteer browsers install chrome` explícito (19/08/2026) --
    # @arcasdk/pdf (PDF de factura) depende de Puppeteer, cuyo postinstall
    # debería descargar Chromium solo, pero Render cachea `node_modules`
    # entre builds y no lo volvió a disparar: el deploy quedaba con
    # "Could not find Chrome" en runtime pese al build "exitoso". Correrlo
    # como paso explícito del build (ver .puppeteerrc.cjs para dónde cae el
    # caché) no depende de que el postinstall se dispare -- es idempotente,
    # si el binario ya está no vuelve a bajarlo.
    buildCommand: npm install && npx puppeteer browsers install chrome && npm run build && npm run migrate:tenants
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"

      # SSL para TODOS los pools de Postgres del proceso (platform, tenant,
      # legado) — ver db/pg.client.ts::sslConfig(). Sin esto, los pools caen
      # a ssl:false y la conexión a Neon/Supabase falla. No es un secreto,
      # pero si falta, el proceso no debe asumir un default en silencio.
      - key: NEON_SSL
        value: "true"

      # ---------------------------------------------------------------------------
      # Secretos — definir manualmente en Render Dashboard (sync: false = no commitear)
      # ---------------------------------------------------------------------------

      # JWT
      - key: JWT_SECRET
        sync: false

      # Base de datos central (plataforma multi-tenant)
      - key: PLATFORM_DATABASE_URL
        sync: false

      # Cifrado de connection strings de tenants
      # Generar con: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      - key: DB_ENCRYPTION_KEY
        sync: false

      # CORS — dominio del frontend (ej. https://mi-app.vercel.app). También
      # reusada (22/08/2026, D2) para armar el link de invitación de
      # usuarios que se manda por mail -- ver app.ts, variable frontendUrl.
      - key: CORS_ORIGIN
        sync: false

      # SUPERADMIN (/platform/*) — clave separada de JWT_SECRET a propósito
      # (security/platform.auth.middleware.ts). No estaban declaradas acá
      # antes del 15/08/2026 — si no están seteadas en el dashboard de
      # Render, el login de superadmin da 503 PLATFORM_AUTH_NOT_CONFIGURED
      # (PLATFORM_ADMIN_EMAIL/PASSWORD) o 500 (PLATFORM_JWT_SECRET), nunca
      # falla en silencio.
      - key: PLATFORM_JWT_SECRET
        sync: false
      - key: PLATFORM_ADMIN_EMAIL
        sync: false
      - key: PLATFORM_ADMIN_PASSWORD
        sync: false

      # ---------------------------------------------------------------------------
      # Neon — provisioning automático de BD por negocio (15/08/2026)
      # Reemplaza el bloque de Supabase que quedó sin usar tras el code
      # review de agosto 2026 (ver platform/tenant-db.setup.ts) — mismo
      # propósito ("crear la BD del tenant sin que nadie entre a la consola
      # a mano"), proveedor real, no aspiracional.
      # ---------------------------------------------------------------------------

      # Neon Console → Account Settings → API Keys
      - key: NEON_API_KEY
        sync: false

      # Proyecto donde viven todos los tenants (hoy: DB-APP-PPMS)
      - key: NEON_PROJECT_ID
        value: ancient-king-17098519

      # Branch siempre vacío del que ramifican los tenants nuevos — ver
      # platform/neon-provisioning.ts para el porqué. Completar después de
      # crearlo (no autogenerado por este archivo).
      - key: NEON_TEMPLATE_BRANCH_ID
        sync: false

      # ---------------------------------------------------------------------------
      # Mails transaccionales (punto 5/E5, pendientes-2026-08-15.md)
      # Sin estas dos, email/email.sender.ts usa NoopEmailSender (loguea, no
      # falla) — el negocio queda operativo sin esta feature puntual, fail-open
      # a propósito, mismo criterio que el aprovisionamiento de Neon.
      # ---------------------------------------------------------------------------

      # Resend → API Keys. Infraestructura de la plataforma, no por tenant
      # (A2.9, criterios-negocio.md) — el nombre que ve el cliente sale de
      # business_profile de cada negocio, no de acá.
      - key: RESEND_API_KEY
        sync: false

      # Dirección verificada (SPF/DKIM) en Resend — ej. notificaciones@zuluhub.com.ar
      - key: RESEND_FROM_EMAIL
        sync: false

      # ---------------------------------------------------------------------------
      # Login con Google (punto 5/E5, segunda mitad — pendientes-2026-08-15.md)
      # Sin esto, POST /api/login/google y /api/customer/:slug/login/google
      # rechazan con un error claro (fail-closed a propósito, es un camino de
      # auth, no como el mail) — google-oauth.ts, security/auth.service.ts.
      # ---------------------------------------------------------------------------

      # Google Cloud Console → APIs & Services → Credentials → OAuth client ID.
      # El MISMO Client ID que NEXT_PUBLIC_GOOGLE_CLIENT_ID en el frontend
      # (Vercel) -- es público por diseño de OAuth, no es un secreto, pero
      # igual va acá para no tenerlo hardcodeado en el código del backend.
      - key: GOOGLE_CLIENT_ID
        sync: false

      # ---------------------------------------------------------------------------
      # Error tracking — Sentry (1.2, docs/auditoria-tecnica-infra-reservas.md,
      # cuenta creada por el dueño 25/08/2026)
      # ---------------------------------------------------------------------------

      # Sentry → Settings del proyecto → Client Keys (DSN). Igual que
      # GOOGLE_CLIENT_ID, el DSN no es secreto (solo permite escribir
      # eventos, no leerlos) pero va acá para no hardcodearlo en
      # instrument.ts. Sin esta variable, Sentry.init() queda en no-op
      # (fail-open a propósito) -- el proceso arranca igual, simplemente
      # sin reportar errores.
      - key: SENTRY_DSN
        sync: false
