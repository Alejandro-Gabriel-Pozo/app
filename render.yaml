services:
  - type: web
    name: reservations-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"

      # ---------------------------------------------------------------------------
      # Secretos — definir manualmente en Render Dashboard (sync: false = no commitear)
      # ---------------------------------------------------------------------------

      # JWT
      - key: JWT_SECRET
        sync: false

      # Base de datos central (plataforma multi-tenant)
      - key: PLATFORM_DATABASE_URL
        sync: false

      # Base de datos del tenant (por negocio — provisionada vía Supabase)
      - key: DATABASE_URL
        sync: false

      # Cifrado de connection strings de tenants
      - key: DB_ENCRYPTION_KEY
        sync: false

      # CORS — dominio del frontend (ej. https://mi-app.vercel.app)
      - key: CORS_ORIGIN
        sync: false
